<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qui a mis ça ? - Édition Maître du Jeu</title>
  
  <!-- Configuration PWA (App Mobile) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#14161c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon.png">

  <!-- Bibliothèques -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  
  <!-- NOUVEAU : Générateur de PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body { margin: 0; padding: 0; background: #14161c; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    /* ---------- Configuration Firebase ---------- */
    // ⚠️ REMPLACE L'URL CI-DESSOUS PAR CELLE DE TA BASE FIREBASE ⚠️
    const firebaseConfig = {
      databaseURL: "https://qui-a-mis-ca-default-rtdb.europe-west1.firebasedatabase.app" 
    };
    
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    /* ---------- Icônes ---------- */
    const Copy = ({ size = 16 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>;
    const Check = ({ size = 16 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>;
    const Users = ({ size = 14 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
    const Music = ({ size = 14 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>;
    const Clock = ({ size = 14 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;

    /* ---------- Polices ---------- */
    const FONT_HREF = "https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Special+Elite&family=Permanent+Marker&family=Work+Sans:wght@400;500;600;700;800&display=swap";
    function useGoogleFonts() {
      useEffect(() => {
        if (document.getElementById("qamc-fonts")) return;
        const link = document.createElement("link");
        link.id = "qamc-fonts";
        link.rel = "stylesheet";
        link.href = FONT_HREF;
        document.head.appendChild(link);
      }, []);
    }

    /* ---------- Helpers ---------- */
    const LETTERS = "ABCDEFGHJKLMNPQRSTUVWXYZ";
    function genCode() { let s = ""; for (let i = 0; i < 4; i++) s += LETTERS[Math.floor(Math.random() * LETTERS.length)]; return s; }
    function genId() { return Math.random().toString(36).slice(2, 10); }

    /* ---------- Composant Machine à Écrire ---------- */
    function Typewriter({ text, active, delay = 0, speed = 15 }) {
      const [displayed, setDisplayed] = useState("");
      const strText = String(text);

      useEffect(() => {
        if (!active) {
          setDisplayed(strText);
          return;
        }
        let timeout;
        let iv;
        setDisplayed("");
        
        timeout = setTimeout(() => {
          let i = 0;
          iv = setInterval(() => {
            i += 2;
            setDisplayed(strText.substring(0, i));
            if (i >= strText.length) clearInterval(iv);
          }, speed);
        }, delay);
        
        return () => {
          clearTimeout(timeout);
          clearInterval(iv);
        };
      }, [strText, active, delay, speed]);

      return <>{displayed}</>;
    }

    /* ---------- Base de données Multijoueur ---------- */
    function toPath(key) { return key.replace(/:/g, '/'); }
    async function sGet(key) { try { const snap = await db.ref(toPath(key)).once('value'); return snap.val(); } catch (e) { return null; } }
    async function sSet(key, value) { try { await db.ref(toPath(key)).set(value); return true; } catch (e) { return false; } }
    async function sList(prefix) { try { const path = toPath(prefix).replace(/\/$/, ''); const snap = await db.ref(path).once('value'); const data = snap.val() || {}; return Object.keys(data).map(id => prefix + id); } catch (e) { return []; } }

    /* ---------- Application ---------- */
    function App() {
      useGoogleFonts();

      const [playerId] = useState(() => {
        const stored = localStorage.getItem("qamc_pid");
        if (stored) return stored;
        const newId = genId();
        localStorage.setItem("qamc_pid", newId);
        return newId;
      });

      const [code, setCode] = useState(() => localStorage.getItem("qamc_code") || "");
      const [isAdmin, setIsAdmin] = useState(() => localStorage.getItem("qamc_admin") === "true");
      
      const [isCreating, setIsCreating] = useState(false);
      const [joinInput, setJoinInput] = useState("");
      const [nameInput, setNameInput] = useState("");
      const [name, setName] = useState("");
      const [joined, setJoined] = useState(false);
      const [game, setGame] = useState(null);
      const [players, setPlayers] = useState([]);
      const [songDrafts, setSongDrafts] = useState([]);
      const [songsSaved, setSongsSaved] = useState(false);
      const [error, setError] = useState("");
      const [busy, setBusy] = useState(false);
      const [myGuess, setMyGuess] = useState(null);
      const [taggedIndex, setTaggedIndex] = useState(-1);
      const [myScore, setMyScore] = useState(0);
      const [copied, setCopied] = useState(false);
      const [finalScores, setFinalScores] = useState(null);
      const [history, setHistory] = useState(null); 
      const [loadingFinal, setLoadingFinal] = useState(false);
      const [currentGuesses, setCurrentGuesses] = useState({});

      useEffect(() => {
        if (code) localStorage.setItem("qamc_code", code);
        else localStorage.removeItem("qamc_code");
      }, [code]);

      useEffect(() => {
        if (!code) return;
        let stopped = false;
        const poll = async () => {
          const g = await sGet(`qamc:${code}:game`);
          if (!stopped && g) {
            setGame(g);
            if (g.status === "quiz") {
              const guesses = await sGet(`qamc:${code}:guesses:${g.currentIndex}`);
              if (!stopped) setCurrentGuesses(guesses || {});
            }
          }
          const keys = await sList(`qamc:${code}:player:`);
          if (keys.length) {
            const list = await Promise.all(keys.map((k) => sGet(k)));
            if (!stopped) setPlayers(list.filter(Boolean).sort((a, b) => a.joinedAt - b.joinedAt));
          }
        };
        poll();
        const iv = setInterval(poll, 1500);
        return () => { stopped = true; clearInterval(iv); };
      }, [code]);

      useEffect(() => {
        if (!joined && players.length > 0) {
          const me = players.find(p => p.id === playerId);
          if (me) {
            let currentName = me.name;
            
            if (currentName.toLowerCase().endsWith("#admin")) {
              currentName = currentName.substring(0, currentName.length - 6).trim();
              localStorage.setItem("qamc_admin", "true");
              setIsAdmin(true);
              sSet(`qamc:${code}:player:${playerId}`, { ...me, name: currentName });
            }

            setName(currentName);
            setJoined(true);
            if (me.songs && me.songs.length > 0) {
              const drafts = [];
              me.songs.forEach((s, i) => drafts[i] = s.url);
              setSongDrafts(drafts);
              setSongsSaved(true);
            }
          }
        }
      }, [players, joined, playerId, code]);

      useEffect(() => {
        if (currentGuesses && currentGuesses[playerId]) {
          setMyGuess(currentGuesses[playerId].guessedId);
        } else {
          setMyGuess(null);
        }
      }, [currentGuesses, playerId, game && game.currentIndex]);

      useEffect(() => {
        if (!game || !game.revealed || !game.order) return;
        if (taggedIndex === game.currentIndex) return;
        setTaggedIndex(game.currentIndex);
        const song = game.order[game.currentIndex];
        
        if (song && myGuess && myGuess === song.ownerId && playerId !== song.ownerId) {
          setMyScore((s) => s + 1);
        }
      }, [game && game.revealed, game && game.currentIndex]);

      useEffect(() => {
        if (game && game.status === "end" && !finalScores && !loadingFinal) {
          loadFinalScores();
        }
      }, [game && game.status]);

      async function loadFinalScores() {
        setLoadingFinal(true);
        const totals = {};
        players.forEach((p) => { totals[p.id] = { id: p.id, name: p.name, correct: 0 }; });
        const order = (game && game.order) || [];
        const hist = []; 
        
        for (let i = 0; i < order.length; i++) {
          const g = await sGet(`qamc:${code}:guesses:${i}`);
          const song = order[i];
          const ownerId = song.ownerId;
          const correctGuessers = [];
          
          if (g) {
            Object.keys(g).forEach((pid) => {
              const guess = g[pid];
              if (!totals[pid]) totals[pid] = { id: pid, name: guess.guessedName || "??", correct: 0 };
              
              if (guess.guessedId === ownerId && pid !== ownerId) {
                totals[pid].correct += 1;
                correctGuessers.push(guess.guessedName);
              }
            });
          }
          
          hist.push({
            trackNum: i + 1,
            url: song.url,
            ownerName: song.ownerName,
            correctGuessers: correctGuessers
          });
        }
        
        setHistory(hist);
        setFinalScores(Object.values(totals).sort((a, b) => b.correct - a.correct));
        setLoadingFinal(false);
      }

      async function handleCreate(settings) {
        setBusy(true); setError("");
        let c = genCode();
        let tries = 0;
        while ((await sGet(`qamc:${c}:game`)) && tries < 6) { c = genCode(); tries++; }
        
        const g = { 
          hostId: playerId, 
          status: "lobby", 
          order: [], 
          currentIndex: -1, 
          revealed: false, 
          createdAt: Date.now(),
          settings: settings
        };
        
        const ok = await sSet(`qamc:${c}:game`, g);
        setBusy(false);
        if (!ok) { setError("Impossible de créer l'enquête (vérifie ta base de données Firebase)."); return; }
        setIsCreating(false);
        setGame(g); 
        setCode(c);
      }

      async function handleJoin() {
        const c = joinInput.trim().toUpperCase();
        if (!c) return;
        setBusy(true); setError("");
        const g = await sGet(`qamc:${c}:game`);
        setBusy(false);
        if (!g) { setError("Code introuvable. Vérifie auprès de l'hôte."); return; }
        setGame(g); setCode(c);
      }

      async function handleRegister() {
        let pseudo = nameInput.trim();
        if (!pseudo) return;
        setBusy(true);
        
        let isUserAdmin = false;
        if (pseudo.toLowerCase().endsWith("#admin")) {
          isUserAdmin = true;
          pseudo = pseudo.substring(0, pseudo.length - 6).trim();
          localStorage.setItem("qamc_admin", "true");
        } else {
          localStorage.removeItem("qamc_admin");
        }
        setIsAdmin(isUserAdmin);

        const p = { id: playerId, name: pseudo, songs: [], joinedAt: Date.now() };
        await sSet(`qamc:${code}:player:${playerId}`, p);
        setBusy(false);
        setName(pseudo); setJoined(true);
      }

      function updateDraft(i, val) {
        setSongDrafts((d) => { const n = [...d]; n[i] = val; return n; });
        setSongsSaved(false);
      }

      async function handleSaveSongs() {
        const required = game.settings.songsPerPlayer;
        const parsed = [];
        for (let i = 0; i < required; i++) {
          if (songDrafts[i] && songDrafts[i].trim()) {
            parsed.push({ url: songDrafts[i].trim() });
          }
        }
        
        if (parsed.length < required) {
          setError(`Il manque des musiques ! Ajoute tes ${required} choix.`);
          return;
        }
        
        setError(""); setBusy(true);
        const p = { id: playerId, name, songs: parsed, joinedAt: Date.now() };
        await sSet(`qamc:${code}:player:${playerId}`, p);
        setBusy(false); setSongsSaved(true);
      }

      async function handleStartQuiz() {
        const pool = [];
        players.forEach((pl) => {
          (pl.songs || []).forEach((s) => pool.push({ ...s, ownerId: pl.id, ownerName: pl.name }));
        });
        if (pool.length < 2) return;
        for (let i = pool.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        const g = { ...game, status: "quiz", order: pool, currentIndex: 0, revealed: false };
        setGame(g);
        await sSet(`qamc:${code}:game`, g);
      }

      async function handleStartTimer() {
        if (!game || game.hostId !== playerId) return;
        const g = { ...game, timerEndsAt: Date.now() + (game.settings.timer * 1000) };
        setGame(g);
        await sSet(`qamc:${code}:game`, g);
      }

      async function handleGuess(pid) {
        if (!game || game.revealed) return;
        if (game.settings.timer > 0 && game.timerEndsAt && Date.now() >= game.timerEndsAt) return;
        
        setMyGuess(pid);
        const key = `qamc:${code}:guesses:${game.currentIndex}`;
        const cur = (await sGet(key)) || {};
        const guessedPlayer = players.find((p) => p.id === pid);
        cur[playerId] = { guessedId: pid, guessedName: (guessedPlayer && guessedPlayer.name) || "?" };
        
        await sSet(key, cur);
        setCurrentGuesses(cur);
      }

      async function handleReveal() {
        const g = { ...game, revealed: true };
        setGame(g);
        await sSet(`qamc:${code}:game`, g);
      }

      async function handleNext() {
        const ni = game.currentIndex + 1;
        const g = ni >= game.order.length
          ? { ...game, status: "end", revealed: false, timerEndsAt: null }
          : { ...game, currentIndex: ni, revealed: false, timerEndsAt: null };
        setGame(g);
        setFinalScores(null);
        await sSet(`qamc:${code}:game`, g);
      }

      function copyCode() {
        try { navigator.clipboard.writeText(code); setCopied(true); setTimeout(() => setCopied(false), 1500); } catch (e) {}
      }

      function resetAll() {
        setCode("");
        localStorage.removeItem("qamc_code");
        setGame(null); setPlayers([]); setJoined(false); setName("");
        setNameInput(""); setJoinInput(""); setSongDrafts([]); setSongsSaved(false);
        setMyGuess(null); setTaggedIndex(-1); setMyScore(0); setFinalScores(null); setError(""); setHistory(null);
        setCurrentGuesses({}); setIsCreating(false);
      }

      function handleQuit() {
        if (window.confirm("Es-tu sûr de vouloir quitter cette affaire ? Tu devras rejoindre à nouveau avec le code si tu changes d'avis.")) {
          resetAll();
        }
      }

      let view = "home";
      if (isCreating) view = "create";
      else if (code && !game) view = "loading";
      else if (code && game && !joined) view = "name";
      else if (code && game && joined) {
        if (game.status === "quiz") view = "quiz";
        else if (game.status === "end") view = "end";
        else view = "lobby";
      }

      const readyPlayers = game ? players.filter((p) => p.songs && p.songs.length >= game.settings.songsPerPlayer) : [];
      const totalEvidence = players.reduce((n, p) => n + ((p.songs && p.songs.length) || 0), 0);

      return (
        <div className="qamc-root">
          <style>{CSS}</style>
          
          {/* 
            On désactive le conteneur principal 'board' quand on est sur 
            l'écran de rapport, car le rapport prend toute la largeur 
          */}
          <div className={view === "end" && history ? "" : "board"}>
            {view === "loading" && <div className="folder"><p className="lobby-hint">Chargement du dossier…</p></div>}
            
            {view === "home" && <HomeScreen onCreate={() => setIsCreating(true)} joinInput={joinInput} setJoinInput={setJoinInput} onJoin={handleJoin} busy={busy} error={error} />}
            
            {view === "create" && <CreateScreen onCancel={() => setIsCreating(false)} onSubmit={handleCreate} busy={busy} error={error} />}
            
            {view === "name" && <NameScreen code={code} nameInput={nameInput} setNameInput={setNameInput} onRegister={handleRegister} busy={busy} />}
            
            {view === "lobby" && (
              <LobbyScreen
                code={code} copied={copied} onCopy={copyCode} players={players} songDrafts={songDrafts} updateDraft={updateDraft}
                onSaveSongs={handleSaveSongs} songsSaved={songsSaved} error={error} onStart={handleStartQuiz}
                readyCount={readyPlayers.length} totalEvidence={totalEvidence} playerId={playerId} isHost={game.hostId === playerId} game={game}
              />
            )}
            
            {view === "quiz" && game && (
              <QuizScreen
                code={code}
                game={game} players={players} myGuess={myGuess} onGuess={handleGuess} onReveal={handleReveal} onStartTimer={handleStartTimer}
                onNext={handleNext} myScore={myScore} playerId={playerId} currentGuesses={currentGuesses}
                isAdmin={isAdmin}
              />
            )}
            
            {view === "end" && <EndScreen code={code} theme={game.settings.theme} finalScores={finalScores} history={history} loading={loadingFinal} onReplay={resetAll} />}
            
            {code && view !== "end" && (
              <div className="no-print" style={{ textAlign: "center", marginTop: "20px" }}>
                <button onClick={handleQuit} className="btn btn-ghost" style={{ fontSize: "11px", opacity: 0.5 }}>
                  🚪 Quitter la partie
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    /* ... Les autres composants restent identiques ... */
    function HomeScreen({ onCreate, joinInput, setJoinInput, onJoin, busy, error }) {
      return (
        <div className="folder">
          <div className="stamp-corner">CONFIDENTIEL</div>
          <h1 className="title">QUI A MIS ÇA ?</h1>
          <p className="subtitle">Le blind test avec l'hôte DJ</p>
          <div className="divider" />
          <button className="btn btn-primary" onClick={onCreate} disabled={busy}>👑 Créer une partie</button>
          <div className="or">— ou —</div>
          <div className="join-row">
            <input className="input code-input" placeholder="CODE" maxLength={4} value={joinInput} onChange={(e) => setJoinInput(e.target.value.toUpperCase())} onKeyDown={(e) => e.key === "Enter" && onJoin()} />
            <button className="btn btn-secondary" onClick={onJoin} disabled={busy}>Rejoindre</button>
          </div>
          {error && <p className="error">{error}</p>}
        </div>
      );
    }

    function CreateScreen({ onCancel, onSubmit, busy, error }) {
      const [theme, setTheme] = useState("Libre");
      const [songs, setSongs] = useState(3);
      const [timer, setTimer] = useState(0);
      const [secret, setSecret] = useState(true);

      return (
        <div className="folder">
          <h1 className="title small">Paramètres de l'enquête</h1>
          <div className="divider" />
          
          <p className="section-label" style={{marginTop: 0}}>Thème imposé</p>
          <input className="input" value={theme} onChange={e => setTheme(e.target.value)} placeholder="Ex: Années 80, Disney, Rap FR..." maxLength={40} />

          <p className="section-label">Pistes par suspect</p>
          <div style={{display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '12px'}}>
            <input type="number" className="input" value={songs} onChange={e => setSongs(Math.max(1, Number(e.target.value)))} min="1" style={{marginBottom: 0, width: '80px', textAlign: 'center'}} />
            <span style={{fontSize: '14px', color: 'var(--pencil)', opacity: 0.8}}>musique(s)</span>
          </div>

          <p className="section-label">Chrono de vote</p>
          <div style={{display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '12px'}}>
            <input type="number" className="input" value={timer} onChange={e => setTimer(Math.max(0, Number(e.target.value)))} min="0" step="5" style={{marginBottom: 0, width: '80px', textAlign: 'center'}} />
            <span style={{fontSize: '14px', color: 'var(--pencil)', opacity: 0.8}}>secondes (0 = infini)</span>
          </div>

          <p className="section-label">Visibilité des musiques</p>
          <select className="input" value={secret ? "true" : "false"} onChange={e => setSecret(e.target.value === "true")}>
            <option value="true">Secrète (Caché aux joueurs)</option>
            <option value="false">Publique (Lien visible par tous)</option>
          </select>

          {error && <p className="error" style={{textAlign: "center"}}>{error}</p>}
          
          <div style={{display: 'flex', gap: '10px', marginTop: '20px'}}>
             <button className="btn btn-ghost" onClick={onCancel} disabled={busy} style={{color: 'var(--pencil)', border: '1px solid var(--pencil)'}}>Annuler</button>
             <button className="btn btn-primary" onClick={() => onSubmit({theme: theme || "Libre", songsPerPlayer: songs, timer, secretTracks: secret})} disabled={busy}>Ouvrir le dossier</button>
          </div>
        </div>
      );
    }

    function NameScreen({ code, nameInput, setNameInput, onRegister, busy }) {
      return (
        <div className="folder">
          <p className="eyebrow">Affaire n°{code}</p>
          <h1 className="title small">Comment on t'appelle, suspect ?</h1>
          <input className="input" placeholder="Ton prénom (ou + #admin)" value={nameInput} onChange={(e) => setNameInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && onRegister()} autoFocus />
          <button className="btn btn-primary" onClick={onRegister} disabled={busy || !nameInput.trim()}>C'est moi</button>
        </div>
      );
    }

    function LobbyScreen({ code, copied, onCopy, players, songDrafts, updateDraft, onSaveSongs, songsSaved, error, onStart, readyCount, totalEvidence, playerId, isHost, game }) {
      const canStart = readyCount >= 2;
      const slots = Array.from({ length: game.settings.songsPerPlayer });

      return (
        <div className="lobby">
          <div className="case-header">
            <div>
              <p className="eyebrow">Dossier</p>
              <h1 className="case-code">{code}</h1>
            </div>
            <button className="btn btn-ghost" onClick={onCopy}>
              {copied ? <Check size={16} /> : <Copy size={16} />} {copied ? "Copié" : "Copier"}
            </button>
          </div>
          
          <div className="theme-box">
            🎯 <strong>Thème :</strong> {game.settings.theme}
          </div>
          
          <p className="lobby-hint">
            Dépose tes musiques. L'hôte se chargera de les diffuser pendant la partie !
          </p>

          <div className="evidence-form">
            <p className="section-label">Tes choix musicaux</p>
            {slots.map((_, i) => (
              <div key={i} className="evidence-slot">
                <span className="slot-num">{i + 1}</span>
                <input
                  className="input"
                  placeholder="Lien Youtube/Spotify ou Titre exact"
                  value={songDrafts[i] || ""}
                  onChange={(e) => updateDraft(i, e.target.value)}
                />
              </div>
            ))}
            {error && <p className="error">{error}</p>}
            <button className="btn btn-primary" onClick={onSaveSongs}>
              {songsSaved ? "✓ Choix validés — mettre à jour" : "Valider mes choix"}
            </button>
          </div>

          <div className="suspects">
            <p className="section-label"><Users size={14} /> Suspects ({players.length})</p>
            <div className="suspect-grid">
              {players.map((p) => {
                const isReady = p.songs && p.songs.length >= game.settings.songsPerPlayer;
                return (
                  <div key={p.id} className="pin-card">
                    <span className="pin" />
                    <span className="pin-name">{p.name}{p.id === playerId ? " (toi)" : ""}</span>
                    <span className={`pin-status ${isReady ? "ready" : ""}`}>{p.songs ? p.songs.length : 0}/{game.settings.songsPerPlayer}</span>
                  </div>
                );
              })}
            </div>
          </div>
          
          {isHost ? (
            <button className="btn btn-danger" onClick={onStart} disabled={!canStart}>
              🚨 Lancer la partie{!canStart ? " (2 prêts min.)" : ""}
            </button>
          ) : (
            <p className="waiting" style={{marginTop: "20px"}}>En attente que l'hôte lance la partie...</p>
          )}
          <p className="tiny-hint">{totalEvidence} musique(s) au total dans la playlist</p>
        </div>
      );
    }

    function QuizScreen({ code, game, players, myGuess, onGuess, onReveal, onStartTimer, onNext, myScore, playerId, currentGuesses = {}, isAdmin }) {
      const isHost = game.hostId === playerId;
      const song = game.order[game.currentIndex];
      const total = game.order.length;
      
      const [timeLeft, setTimeLeft] = useState(game.settings.timer);
      const isTimerActive = game.settings.timer > 0;
      const hasTimerStarted = !!game.timerEndsAt;
      const isTimeUp = hasTimerStarted && timeLeft <= 0;

      const [stealthReveal, setStealthReveal] = useState(false);

      useEffect(() => {
        setStealthReveal(false);
      }, [game.currentIndex]);
      
      useEffect(() => {
        if (!game.timerEndsAt) {
          setTimeLeft(game.settings.timer);
          return;
        }
        const interval = setInterval(() => {
          const remaining = Math.ceil((game.timerEndsAt - Date.now()) / 1000);
          if (remaining <= 0) {
            setTimeLeft(0);
            clearInterval(interval);
          } else {
            setTimeLeft(remaining);
          }
        }, 100);
        return () => clearInterval(interval);
      }, [game.timerEndsAt, game.settings.timer]);

      if (!song) return null;
      
      const isUrl = song.url.startsWith("http");
      const votesCount = Object.keys(currentGuesses).length;
      const showSecret = game.settings.secretTracks && !isHost && !game.revealed;

      return (
        <div className="quiz">
          <div className="quiz-top">
            <div style={{ display: "flex", flexDirection: "column", gap: "4px" }}>
              <span className="eyebrow">Piste n°{game.currentIndex + 1} / {total}</span>
              <span className="theme-chip">🎯 Thème : {game.settings.theme}</span>
            </div>
            <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: "4px" }}>
              <span className="score-chip"><Music size={14} /> {myScore} pts</span>
              <span className="eyebrow" style={{ margin: 0 }}>Code: {code}</span>
            </div>
          </div>

          <div className="evidence-card">
            {game.revealed && (
              <div className="stamp">
                C'ÉTAIT
                <br />
                {song.ownerName}
              </div>
            )}
            
            <div className="dj-booth">
              {!game.revealed && showSecret ? (
                <div className="mystery-box">
                  <div className="pulsing-dot"></div>
                  <span>🎧 L'hôte diffuse la musique...</span>
                </div>
              ) : (
                <div className="reveal-box">
                  <p className="eyebrow">{game.revealed ? "Indice révélé :" : (isHost ? "À DIFFUSER :" : "À TOI DE JOUER :")}</p>
                  {isUrl ? (
                    <a href={song.url} target="_blank" rel="noreferrer" className="btn btn-primary" style={{marginTop: '10px'}}>
                      🔗 Ouvrir le lien
                    </a>
                  ) : (
                    <p className="song-title-text">{song.url}</p>
                  )}
                </div>
              )}
            </div>
          </div>

          {!game.revealed && (
            <>
              {isTimerActive && (
                <div className="timer-bar-container">
                  <div className={`timer-text ${isTimeUp ? "danger" : ""}`}>
                    <Clock size={16} /> {hasTimerStarted ? (isTimeUp ? "TEMPS ÉCOULÉ !" : `${timeLeft}s`) : "En attente du chrono..."}
                  </div>
                  {hasTimerStarted && !isTimeUp && (
                     <div className="timer-progress" style={{width: `${(timeLeft / game.settings.timer) * 100}%`}}></div>
                  )}
                </div>
              )}

              <p className="prompt">
                À qui appartient ce <span onClick={() => isAdmin && setStealthReveal(!stealthReveal)} style={{cursor: isAdmin ? "pointer" : "default"}}>choix</span> ?
              </p>
              
              <div className="suspect-buttons">
                {players.map((p) => {
                  const isCorrect = p.id === song.ownerId;
                  const applyStealth = isAdmin && stealthReveal && isCorrect && myGuess !== p.id;

                  return (
                    <button 
                      key={p.id} 
                      className={`accuse-btn ${myGuess === p.id ? "picked" : ""}`} 
                      onClick={() => onGuess(p.id)} 
                      disabled={game.revealed || (isTimerActive && (!hasTimerStarted || isTimeUp))}
                      style={applyStealth ? { backgroundColor: "#2a2e38", borderColor: "rgba(242,232,213,0.5)" } : {}}
                    >
                      {p.name}
                    </button>
                  );
                })}
              </div>
              
              {myGuess && !isTimeUp && <p className="waiting">Ton accusation est enregistrée (tu peux changer). 🤫</p>}
              
              {isHost && (
                <div style={{ marginTop: "15px", textAlign: "center", borderTop: "1px dashed rgba(255,255,255,0.1)", paddingTop: "15px" }}>
                  <p className="waiting" style={{ marginBottom: "10px", color: "var(--spotlight)" }}>
                    📊 {votesCount} / {players.length} joueur(s) ont voté
                  </p>
                  
                  {isTimerActive && !hasTimerStarted && (
                    <button className="btn btn-primary" onClick={onStartTimer} style={{marginBottom: "10px"}}>
                      ⏱️ Démarrer le chrono
                    </button>
                  )}
                  
                  <button className="btn btn-secondary" onClick={onReveal} disabled={isTimerActive && hasTimerStarted && !isTimeUp && votesCount < players.length}>
                    Révéler la vérité
                  </button>
                </div>
              )}
            </>
          )}

          {game.revealed && (
            <>
              {myGuess && (
                <p className={`feedback ${myGuess === song.ownerId ? "good" : "bad"}`}>
                  {myGuess === song.ownerId ? "Bien vu, détective 🕵️" : `Raté, c'était ${song.ownerName}`}
                </p>
              )}
              {!myGuess && <p className="feedback bad">Tu n'as pas voté à temps !</p>}
              
              {isHost ? (
                <button className="btn btn-primary" onClick={onNext}>
                  {game.currentIndex + 1 >= total ? "Voir le classement final" : "Musique suivante"}
                </button>
              ) : (
                <p className="waiting">L'hôte va passer à la suite...</p>
              )}
            </>
          )}
        </div>
      );
    }

    function EndScreen({ code, theme, finalScores, history, loading, onReplay }) {
      const [showReport, setShowReport] = useState(false);
      const [animating, setAnimating] = useState(true);
      const [generatingPDF, setGeneratingPDF] = useState(false);

      // NOUVEAU : Fonction de génération via html2pdf
      function downloadPDF() {
        setGeneratingPDF(true);
        setAnimating(false); // On force l'affichage complet du texte immédiatement
        
        // On laisse 300ms à React pour bien afficher la fin du texte avant de prendre la photo
        setTimeout(() => {
          const element = document.getElementById('report-content-to-pdf');
          if (!element) return;
          
          const opt = {
            margin:       15, // Marge propre en mm
            filename:     `Dossier_QAMC_${code}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true }, // Haute définition
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
          };

          if (window.html2pdf) {
            window.html2pdf().set(opt).from(element).save().then(() => {
              setGeneratingPDF(false);
            });
          } else {
            alert("Erreur: Le générateur PDF n'est pas chargé. Vérifiez votre connexion.");
            setGeneratingPDF(false);
          }
        }, 300);
      }

      if (showReport && history) {
        return (
          <div className="report-full-view">
            
            {/* Barre d'outils web flottante */}
            <div className="report-toolbar no-print">
              <button className="btn btn-ghost" onClick={() => setShowReport(false)} style={{color: "var(--paper)", borderColor: "var(--paper)"}}>
                ← Retour au classement
              </button>
              
              {animating && (
                <button className="btn btn-ghost" onClick={() => setAnimating(false)} style={{color: "var(--spotlight)", borderColor: "var(--spotlight)"}}>
                  ⏭️ Passer l'animation
                </button>
              )}
              
              <button className="btn btn-primary" onClick={downloadPDF} disabled={generatingPDF}>
                {generatingPDF ? "Création du PDF..." : "🖨️ Télécharger en PDF"}
              </button>
            </div>
            
            {/* 
              LA FEUILLE A4 VIRTUELLE
              C'est ce conteneur "report-content-to-pdf" qui sera pris en photo par la librairie
            */}
            <div id="report-content-to-pdf" className="report-paper-a4">
              
              {/* Le tampon ne coupera plus rien, il est fixé en haut à droite avec de la marge */}
              <div className="stamp-container">
                <div className="classified-stamp">DÉCLASSIFIÉ</div>
              </div>
              
              <div className="report-header-line">
                <span>ARCHIVES SECRÈTES Q.A.M.C</span>
                <span>CODE : {code}</span>
              </div>

              <h1 className="report-title">
                <Typewriter text="RAPPORT D'OPÉRATION" active={animating} delay={0} />
              </h1>
              
              <div className="report-meta">
                <div className="meta-row">
                  <span><Typewriter text="DATE :" active={animating} delay={300} /></span> 
                  <strong><Typewriter text={new Date().toLocaleDateString('fr-FR')} active={animating} delay={450} /></strong>
                </div>
                <div className="meta-row">
                  <span><Typewriter text="THÈME CONCERNÉ :" active={animating} delay={600} /></span> 
                  <strong><Typewriter text={theme} active={animating} delay={750} /></strong>
                </div>
                <div className="meta-row">
                  <span><Typewriter text="STATUT DU DOSSIER :" active={animating} delay={900} /></span> 
                  <strong><Typewriter text="RÉSOLU / CLOS" active={animating} delay={1050} /></strong>
                </div>
              </div>

              <h2 className="report-section-title">
                <Typewriter text="PIÈCES À CONVICTION" active={animating} delay={1300} />
              </h2>
              
              <div className="report-list">
                {history.map((h, i) => {
                  const baseDelay = 1500 + i * 800;
                  return (
                    <div key={i} className="report-item">
                      <div className="item-header">
                        <Typewriter text={`PIÈCE N°${String(h.trackNum).padStart(2, '0')}`} active={animating} delay={baseDelay} />
                      </div>
                      <div className="item-content">
                        <p>
                          <strong><Typewriter text="CONTENU :" active={animating} delay={baseDelay + 150} /></strong> 
                          {" "} <Typewriter text={h.url} active={animating} delay={baseDelay + 300} />
                        </p>
                        <p>
                          <strong><Typewriter text="SUSPECT IDENTIFIÉ :" active={animating} delay={baseDelay + 450} /></strong> 
                          {" "} <span className="highlight-owner"><Typewriter text={h.ownerName} active={animating} delay={baseDelay + 600} /></span>
                        </p>
                        <p>
                          <strong><Typewriter text="DÉDUCTIONS EXACTES :" active={animating} delay={baseDelay + 750} /></strong> 
                          {" "} <Typewriter text={h.correctGuessers.length > 0 ? h.correctGuessers.join(", ") : "Aucune. Parfaite dissimulation."} active={animating} delay={baseDelay + 900} />
                        </p>
                      </div>
                    </div>
                  );
                })}
              </div>
              
              <div className="report-footer-line">
                *** FIN DE TRANSMISSION ***
              </div>

            </div>
          </div>
        );
      }

      return (
        <div className="folder end">
          <div className="stamp-corner big">DOSSIER CLOS</div>
          <h1 className="title small">Classement final</h1>
          {loading && <p className="lobby-hint">Calcul des scores…</p>}
          {!loading && finalScores && (
            <div className="ranking">
              {finalScores.map((p, i) => (
                <div key={p.id} className={`rank-row ${i === 0 ? "first" : ""}`}>
                  <span className="rank-pos">{i + 1}</span>
                  <span className="rank-name">{p.name}</span>
                  <span className="rank-score">{p.correct} pts</span>
                </div>
              ))}
            </div>
          )}
          
          <div style={{display: "flex", flexDirection: "column", gap: "10px", marginTop: "20px"}}>
            {history && (
              <button className="btn btn-secondary" onClick={() => { setShowReport(true); setAnimating(true); }}>
                📄 Voir le dossier détaillé
              </button>
            )}
            <button className="btn btn-primary" onClick={onReplay}>Nouvelle partie</button>
          </div>
        </div>
      );
    }

    const CSS = `

    .qamc-root *, .qamc-root *::before, .qamc-root *::after { box-sizing: border-box; }

    .folder.end { transform: rotate(0.5deg); }
    .stamp-corner { position: absolute; top: 16px; right: 4px; border: 2px solid var(--thread); color: var(--thread); font-family: 'Special Elite', monospace; font-size: 10px; letter-spacing: 1.5px; padding: 3px 8px; transform: rotate(8deg); opacity: 0.75; }
    .stamp-corner.big { font-size: 13px; }

    .title.small { font-size: 22px; }
    .subtitle { margin: 0 0 20px; opacity: 0.75; font-size: 14px; }
    .eyebrow { font-family: 'Special Elite', monospace; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.6; margin: 0 0 4px; }

    .timer-text.danger { color: var(--thread); font-weight: bold; }

    .prompt { font-family: 'Special Elite', monospace; text-align: center; margin: 0 0 10px; color: var(--paper); font-size: 14px; }
    .suspect-buttons { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin-bottom: 14px; }
    .accuse-btn { background: var(--ink); color: var(--paper); border: 1.5px solid rgba(242,232,213,0.2); border-radius: 8px; padding: 10px 8px; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .accuse-btn.picked { background: var(--spotlight); color: #241705; border-color: var(--spotlight); }
    .accuse-btn:disabled { opacity: 0.5; }
    .waiting { text-align: center; font-size: 12px; color: var(--paper-2); opacity: 0.7; margin: 10px 0; font-style: italic; }
    .feedback { text-align: center; font-weight: 700; margin: 16px 0; font-size: 15px; }
    .feedback.good { color: #7ed19a; }
    .feedback.bad { color: #e08a8a; }
    
    .ranking { margin: 20px 0; }
    .rank-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px dashed rgba(58,46,34,0.2); }
    .rank-row.first { font-weight: 800; }
    .rank-pos { font-family: 'Special Elite', monospace; width: 22px; }
    .rank-name { flex: 1; }
    .rank-score { font-family: 'Special Elite', monospace; }
    @media (max-width: 400px) {
      .title { font-size: 26px; }
      .case-code { font-size: 24px; }
    }

    /* --- STYLES DU NOUVEAU RAPPORT (POUR HTML2PDF) --- */
    .report-full-view { width: 100%; max-width: 800px; margin: 0 auto; padding-bottom: 50px; }
    .report-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    
    /* La vraie feuille A4 affichée sur le Web et capturée en PDF */
    .report-paper-a4 { 
      background: #fff; 
      color: #111; 
      font-family: 'Courier Prime', Courier, monospace; 
      position: relative; 
      border-radius: 4px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
      padding: 40px 30px; 
      text-align: left;
    }
    
    /* Le tampon repensé pour ne rien cacher */
    .stamp-container { position: absolute; top: 30px; right: 30px; z-index: 10; pointer-events: none; }
    .classified-stamp { 
      color: #d64545; 
      border: 4px solid #d64545; 
      padding: 10px 20px; 
      font-family: 'Special Elite', monospace; 
      font-weight: bold; 
      font-size: 22px; 
      transform: rotate(12deg); 
      opacity: 0.85; 
      letter-spacing: 3px; 
      border-radius: 4px;
    }

    .report-header-line { border-bottom: 3px double #111; margin-bottom: 30px; padding-bottom: 8px; display: flex; justify-content: space-between; font-weight: bold; font-size: 14px; opacity: 0.8; }
    .report-footer-line { border-top: 3px double #111; margin-top: 40px; padding-top: 10px; text-align: center; font-weight: bold; font-size: 14px; opacity: 0.8; }

    .report-title { font-family: 'Special Elite', monospace; font-size: 28px; text-align: left; margin: 0 0 24px; letter-spacing: 2px; }
    
    .report-meta { padding: 15px; margin-bottom: 30px; display: grid; grid-template-columns: 1fr; gap: 10px; font-size: 15px; background: rgba(0,0,0,0.03); border-left: 4px solid #111; }
    .meta-row { display: flex; justify-content: space-between; border-bottom: 1px dotted #888; padding-bottom: 4px; min-height: 20px; }
    .meta-row:last-child { border-bottom: none; padding-bottom: 0; }
    
    .report-section-title { font-size: 18px; border-bottom: 2px solid #111; margin-bottom: 20px; padding-bottom: 6px; font-weight: bold; min-height: 24px; text-transform: uppercase; }
    
    .report-list { text-align: left; }
    .report-item { border: 1px solid #555; margin-bottom: 20px; background: #fff; page-break-inside: avoid; /* Instruction pour la librairie PDF */ }
    .item-header { background: #e5e5e5; padding: 8px 12px; font-weight: bold; border-bottom: 1px solid #555; font-family: 'Special Elite', monospace; font-size: 15px; min-height: 22px; color: #111; }
    .item-content { padding: 15px; font-size: 14px; line-height: 1.6; }
    .item-content p { margin: 8px 0; word-break: break-word; min-height: 18px; }
    .highlight-owner { font-weight: bold; font-size: 15px; text-transform: uppercase; text-decoration: underline; }
    `;

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
